<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

  .scene { position: relative; width: 600px; height: 600px; display: flex; align-items: center; justify-content: center; }

  /* Orbits */
  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }

  /* Center */
  .center {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #16a34a, #065f46, #15803d);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    box-shadow: 0 0 30px rgba(22,163,74,0.4), 0 0 60px rgba(22,163,74,0.1);
    animation: pulse-center 3s ease-in-out infinite;
  }
  .center::before {
    content: '';
    position: absolute;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1px solid rgba(22,163,74,0.3);
    animation: ping 2s ease-out infinite;
  }
  .center::after {
    content: '';
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(22,163,74,0.15);
    animation: ping 2s ease-out infinite;
    animation-delay: 0.5s;
  }
  .center-dot { width: 28px; height: 28px; background: rgba(255,255,255,0.9); border-radius: 50%; }

  @keyframes pulse-center { 0%,100%{box-shadow:0 0 30px rgba(22,163,74,0.4),0 0 60px rgba(22,163,74,0.1)} 50%{box-shadow:0 0 40px rgba(22,163,74,0.6),0 0 80px rgba(22,163,74,0.2)} }
  @keyframes ping { 0%{transform:scale(1);opacity:0.6} 100%{transform:scale(1.4);opacity:0} }

  /* Nodes */
  .node {
    position: absolute;
    width: 44px; height: 44px;
    transform-origin: center;
    cursor: pointer;
    z-index: 5;
    transition: all 0.4s ease;
  }
  .node-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #0a0a0a;
    border: 2px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.3s ease;
    position: relative;
  }
  .node:hover .node-circle, .node.active .node-circle {
    background: #fff;
    border-color: #fff;
    transform: scale(1.3);
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .node.active .node-circle {
    background: #16a34a;
    border-color: #16a34a;
    box-shadow: 0 0 20px rgba(22,163,74,0.5);
  }
  .node-label {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    transition: color 0.3s;
  }
  .node.active .node-label { color: #16a34a; }

  /* Popup card */
  .popup {
    position: absolute;
    width: 200px;
    background: rgba(0,0,0,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 14px;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: none;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .popup.show { display: block; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  .popup::before { content:''; position:absolute; top:-8px;left:50%;transform:translateX(-50%);width:1px;height:8px;background:rgba(255,255,255,0.3); }
  .popup-status { display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:1px;border-radius:20px;padding:2px 8px;margin-bottom:8px; }
  .status-done { background:#16a34a22;color:#16a34a;border:1px solid #16a34a44; }
  .status-progress { background:#d9770622;color:#d97706;border:1px solid #d9770644; }
  .status-pending { background:#33333366;color:#777;border:1px solid #333; }
  .popup-title { font-size:12px;font-weight:600;margin-bottom:6px; }
  .popup-desc { font-size:10px;color:rgba(255,255,255,0.6);line-height:1.5;margin-bottom:10px; }
  .popup-bar-label { display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:4px; }
  .popup-bar { background:rgba(255,255,255,0.08);height:3px;border-radius:2px;overflow:hidden; }
  .popup-bar-fill { height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:2px; }

  .label-top { color: #16a34a; font-size: 11px; font-weight: 600; position: absolute; top: 20px; left: 24px; letter-spacing: 1px; opacity: 0.7; }
  .hint { position:absolute;bottom:20px;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.5px; }
</style>
</head>
<body>

<div class="scene" id="scene" onclick="handleSceneClick(event)">
  <div class="label-top">PIPELINE DE CONTEÚDO</div>

  <div class="orbit-ring" style="width:420px;height:420px;"></div>
  <div class="orbit-ring" style="width:300px;height:300px;opacity:0.5;"></div>

  <div class="center"><div class="center-dot"></div></div>

  <div class="hint">Clique em um nó para explorar</div>
</div>

<script>
const modules = [
  { id:1, emoji:'📊', label:'Concorrentes', status:'done', desc:'8 perfis monitorados ativamente via Apify + Instaloader.', energy:95 },
  { id:2, emoji:'🖼️', label:'Posts', status:'done', desc:'247 posts coletados e analisados com GPT-4o Vision.', energy:88 },
  { id:3, emoji:'📋', label:'Relatório', status:'done', desc:'Relatório semanal de tendências e padrões virais.', energy:75 },
  { id:4, emoji:'✍️', label:'Criar', status:'progress', desc:'Geração de posts com voz do Nathan + exemplos aprovados.', energy:60 },
  { id:5, emoji:'🎠', label:'Carrossel', status:'done', desc:'Slides gerados com GPT-4o baseado em relatório semanal.', energy:70 },
  { id:6, emoji:'🎙️', label:'Voz', status:'done', desc:'Perfil de voz analisado: tom direto, técnico, agro.', energy:82 },
  { id:7, emoji:'📰', label:'Notícias', status:'pending', desc:'Monitor RSS de 4 fontes agro. Pronto para ativar.', energy:30 },
  { id:8, emoji:'📅', label:'Calendário', status:'pending', desc:'Plano editorial semanal com IA. Em desenvolvimento.', energy:15 },
];

const RADIUS = 210;
let angle = 0;
let animFrame;
let activeId = null;
const nodeEls = {};

function placeNodes(a) {
  modules.forEach((m, i) => {
    const theta = (i / modules.length) * 2 * Math.PI + a;
    const x = Math.cos(theta) * RADIUS;
    const y = Math.sin(theta) * RADIUS;
    const el = nodeEls[m.id];
    if (!el) return;
    el.style.transform = `translate(${x - 22}px, ${y - 22}px)`;
    const depth = (Math.sin(theta) + 1) / 2;
    el.style.opacity = activeId ? (activeId === m.id ? 1 : 0.4) : (0.4 + 0.6 * depth);
    el.style.zIndex = activeId === m.id ? 50 : Math.round(10 + 40 * depth);
  });
}

function animate() {
  if (!activeId) {
    angle += 0.005;
    placeNodes(angle);
  }
  animFrame = requestAnimationFrame(animate);
}

function buildNodes() {
  const scene = document.getElementById('scene');
  modules.forEach(m => {
    const wrap = document.createElement('div');
    wrap.className = 'node';
    wrap.id = 'node-' + m.id;
    wrap.innerHTML = `
      <div class="node-circle">${m.emoji}</div>
      <div class="node-label">${m.label}</div>
      <div class="popup" id="popup-${m.id}">
        <div class="popup-status status-${m.status === 'done' ? 'done' : m.status === 'progress' ? 'progress' : 'pending'}">
          ${m.status === 'done' ? '✓ ATIVO' : m.status === 'progress' ? '⟳ EM ANDAMENTO' : '○ PENDENTE'}
        </div>
        <div class="popup-title">${m.label}</div>
        <div class="popup-desc">${m.desc}</div>
        <div class="popup-bar-label"><span>⚡ Energia</span><span>${m.energy}%</span></div>
        <div class="popup-bar"><div class="popup-bar-fill" style="width:${m.energy}%"></div></div>
      </div>
    `;
    wrap.addEventListener('click', e => { e.stopPropagation(); toggleNode(m.id); });
    scene.appendChild(wrap);
    nodeEls[m.id] = wrap;
  });
}

function toggleNode(id) {
  if (activeId === id) {
    activeId = null;
    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.popup').forEach(p => p.classList.remove('show'));
    placeNodes(angle);
    return;
  }
  activeId = id;
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.popup').forEach(p => p.classList.remove('show'));
  const el = nodeEls[id];
  el.classList.add('active');
  document.getElementById('popup-' + id).classList.add('show');
  placeNodes(angle);
}

function handleSceneClick(e) {
  if (e.target.id === 'scene' || e.target.closest('.orbit-ring') || e.target.closest('.center') || e.target.closest('.hint') || e.target.closest('.label-top')) {
    activeId = null;
    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.popup').forEach(p => p.classList.remove('show'));
    placeNodes(angle);
  }
}

buildNodes();
placeNodes(angle);
animate();
</script>
</body>
</html>
